name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate files, resources, and inspector behavior
        run: python3 scripts/validate_project.py
      - name: Install rendering dependencies
        run: python3 -m pip install -r requirements-render.txt
      - name: Test exact typography and output
        run: python3 -m unittest discover -s tests -v
